# Environnement de TP du m164 : MariaDB + Adminer (PostgreSQL + pgAdmin en option).
# Identifiants de LAB uniquement (voir README.md) — jamais en production.
services:
  mariadb:
    image: mariadb:11.4
    container_name: m164-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: m164lab
      MARIADB_DATABASE: ecole
      MARIADB_USER: apprenti
      MARIADB_PASSWORD: m164lab
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./init/mariadb:/docker-entrypoint-initdb.d:ro

  postgres:
    # Service optionnel, utilisé dès la S06 :
    #   docker compose --profile complet up -d
    profiles: ["complet"]
    image: postgres:17
    container_name: m164-postgres
    environment:
      POSTGRES_USER: apprenti
      POSTGRES_PASSWORD: m164lab
      POSTGRES_DB: ecole
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro

  pgadmin:
    # Client graphique de PostgreSQL, avec le serveur m164-postgres déjà déclaré :
    #   docker compose --profile complet up -d   puis   http://localhost:5050
    profiles: ["complet"]
    image: dpage/pgadmin4:9
    container_name: m164-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: apprenti@example.com
      PGADMIN_DEFAULT_PASSWORD: m164lab
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - postgres

  adminer:
    image: adminer:5
    container_name: m164-adminer
    environment:
      ADMINER_DEFAULT_SERVER: mariadb
    ports:
      - "8080:8080"

volumes:
  mariadb-data:
  postgres-data:
  pgadmin-data:
